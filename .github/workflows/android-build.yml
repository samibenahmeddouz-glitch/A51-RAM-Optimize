name: Build A51 RAM Optimizer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK Manager found:"
          echo "$SDKMANAGER"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APKs
        run: |
          gradle --no-daemon :app:assembleDebug :lsposed:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A51-RAM-Optimizer-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            lsposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
